
<div id="all-word" data-id="all-word" class='card'>
                    
    <div class='card-header'>
        <h1>Sözlər</h1>
        
    </div>
    <div class='card-body'>
        <div class="row justify-content-center">
            <div class="col-12 text-right">
                <button (click)="addWord()" class="main-button">Söz əlavə et <i class="fal fa-plus"></i></button>
            </div>
         </div>
        <div class="row">
            <div class="col-12 mb-3">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-3">
                            <label for="">Azərbaycanca</label>
                            <input [(ngModel)]="wordAz" (ngModelChange)="changeAz()" placeholder="Sözün Azərbaycan dilində tərcüməsi" class="nAz" type="text">
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="">İngiliscə</label>
                            <input [(ngModel)]="wordEn" (ngModelChange)="changeEn()" placeholder="Sözün İngilis dilində tərcüməsi" class="nEn" type="text">
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="">Bölmə</label>
                            <mat-select [(ngModel)]="unitId" (selectionChange)="change()" multiple placeholder="Bölmə seçin">
                                <mat-option class="all-word-select" *ngFor="let item of unitList" [value]="item.id">{{item.name}}</mat-option>
                              </mat-select>
                        </div>
                    </div>
            </div>
        </div>
        <div *ngIf="!storiedData.length" class="row my-3">
            <div class="col-12 text-center">
                <p>Heç bir söz əlavə olunmayıb</p>
            </div>
        </div>
        <div *ngIf="storiedData.length&&!filteredData.length" class="row my-3">
            <div class="col-12 text-center">
                <p>Heç bir söz tapılmadı</p>
            </div>
        </div>
        <div class="table-container" *ngIf="filteredData.length">
            <table mat-table [dataSource]="dataSource">

                <ng-container matColumnDef="no">
                  <th mat-header-cell *matHeaderCellDef> № </th>
                  <td mat-cell *matCellDef="let element; let i = index"> {{this.paginator.pageIndex == 0 ? i + 1 : 1 + i + this.paginator.pageIndex * this.paginator.pageSize}} </td>
                </ng-container>
              
                <ng-container matColumnDef="nameAz">
                  <th mat-header-cell *matHeaderCellDef> Azərbaycanca <span (click)="changeVisibleLang1()" class="un-visible-i ml-1"><span *ngIf="!hideLang1"><i class="far fa-low-vision"></i></span><span *ngIf="hideLang1"><i class="fas fa-eye"></i></span></span></th>
                  <td mat-cell *matCellDef="let element;let i=index">
                    <span class="un-visible-i mr-1" (click)="hideWord(i)">
                        <span *ngIf="element.hide1===false||(!hideLang1&&element.hide1==undefined)"><i class="far fa-low-vision"></i></span>
                        <span *ngIf="element.hide1===true||(hideLang1&&element.hide1==undefined)"><i class="fas fa-eye"></i></span>
                    </span>
                    <span [ngClass]="{'blur':element.hide1===true||(hideLang1&&element.hide1==undefined)}">{{element.nameAz}}</span>
                  </td>
                </ng-container>
              
                <ng-container matColumnDef="nameEn">
                  <th mat-header-cell *matHeaderCellDef> İngiliscə <span (click)="changeVisibleLang2()" class="un-visible-i ml-1"><span *ngIf="!hideLang2"><i class="far fa-low-vision"></i></span><span *ngIf="hideLang2"><i class="fas fa-eye"></i></span></span></th>
                  <td mat-cell *matCellDef="let element;let i=index">
                    <span class="un-visible-i mr-1" (click)="hideWord2(i)">
                        <span *ngIf="element.hide2===false||(!hideLang2&&element.hide2==undefined)"><i class="far fa-low-vision"></i></span>
                        <span *ngIf="element.hide2===true||(hideLang2&&element.hide2==undefined)"><i class="fas fa-eye"></i></span>
                    </span>
                    <span [ngClass]="{'blur':element.hide2===true||(hideLang2&&element.hide2==undefined)}">{{element.nameEn}}</span>
                    <span class="play" (click)="play(element.nameEn)"><i title="Səsləndir" class="far fa-volume-up"></i></span>
                 </td>
                </ng-container>
              
                <ng-container matColumnDef="unitName">
                  <th mat-header-cell *matHeaderCellDef> Bölmə </th>
                  <td mat-cell *matCellDef="let element"> {{getUnitName(element.unitId)}} </td>
                </ng-container>
    
                <ng-container matColumnDef="operation">
                    <th mat-header-cell *matHeaderCellDef> Əməlliyyat </th>
                    <td mat-cell *matCellDef="let element" class="word-content">
                        <span (click)="editWord(element)" class="edit"><i title="Düzəliş et" class="fal fa-edit"></i></span>
                        <span (click)="deleteWord(element)" class="remove"><i title="Sil" class="fal fa-trash-alt"></i></span>
                    </td>
                  </ng-container>
              
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
          
        <mat-paginator [ngClass]="{'d-none': !filteredData.length}"
        [pageSizeOptions]="pageSizeOptions" [pageIndex]="pageIndex" [pageSize]="pageSize" showFirstLastButtons [length]="length"
        (page)="pageChanged($event)">
    </mat-paginator>
        
    </div>
</div>
